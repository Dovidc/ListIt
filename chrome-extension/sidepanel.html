<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trovelr</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="#2563eb"/>
          <path d="M7 12L10.5 15.5L17 9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Trovelr</span>
      </div>
      <button id="logoutBtn" class="btn-icon" title="Logout" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </header>

    <!-- Login View -->
    <div id="loginView" class="view">
      <div class="login-container">
        <h2>Sign in to Trovelr</h2>
        <p class="subtitle">Access your listings to post on Facebook Marketplace</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="apiUrl">Server URL</label>
            <input type="url" id="apiUrl" value="https://trovelr.com" placeholder="https://trovelr.com">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Password">
          </div>
          <div id="loginError" class="error-message"></div>
          <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        </form>
      </div>
    </div>

    <!-- Main View -->
    <div id="mainView" class="view" style="display: none;">
      <!-- Search -->
      <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search your listings..." autocomplete="off">
        <button id="clearSearch" class="btn-clear" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Listings Grid -->
      <div id="listingsContainer" class="listings-grid">
        <!-- Listings will be populated here -->
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="loading-state" style="display: none;">
        <div class="spinner"></div>
        <p>Loading listings...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        <p>No listings found</p>
      </div>

      <!-- Selected Listing Panel -->
      <div id="selectedPanel" class="selected-panel" style="display: none;">
        <div class="selected-header">
          <button id="backBtn" class="btn-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back
          </button>
        </div>

        <div class="selected-content">
          <h3 id="selectedTitle">Listing Title</h3>
          <p id="selectedPrice" class="selected-price">$0</p>
          <p id="selectedDescription" class="selected-description"></p>

          <div class="images-section">
            <p class="images-label">Drag images to Facebook:</p>
            <div id="imagesContainer" class="images-grid">
              <!-- Draggable images will be here -->
            </div>
          </div>

          <div class="status-message" id="statusMessage">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>Form filled! Drag images and click Next on Facebook.</span>
          </div>

          <div id="categoryStatus" class="category-status" style="display: none;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
