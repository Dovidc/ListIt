<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trovelr</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Login View -->
    <div id="loginView" class="view">
      <div class="login-wrapper">
        <div class="login-hero">
          <div class="hero-icon">
            <img src="icons/web-app-manifest-192x192.png" width="64" height="64" alt="Trovelr">
          </div>
          <h1 class="hero-title">Welcome to Trovelr</h1>
          <p class="hero-subtitle">Post your listings to Facebook Marketplace in seconds</p>
        </div>

        <div class="login-container">
          <form id="loginForm">
            <div class="form-group">
              <label for="apiUrl">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="2" y1="12" x2="22" y2="12"/>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                Server URL
              </label>
              <input type="url" id="apiUrl" value="https://trovelr.com" placeholder="https://trovelr.com">
            </div>
            <div class="form-group">
              <label for="email">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
                Email
              </label>
              <input type="email" id="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
              <label for="password">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Password
              </label>
              <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <div id="loginError" class="error-message"></div>
            <button type="submit" class="btn-primary" id="loginBtn">
              <span>Sign In</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </form>

        </div>
      </div>
    </div>

    <!-- Main View -->
    <div id="mainView" class="view" style="display: none;">
      <!-- Search -->
      <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search your listings..." autocomplete="off">
        <button id="clearSearch" class="btn-clear" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <button id="logoutBtn" class="btn-logout" title="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <!-- Listings Grid -->
      <div id="listingsContainer" class="listings-grid">
        <!-- Listings will be populated here -->
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="loading-state" style="display: none;">
        <div class="spinner"></div>
        <p>Loading listings...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        <p>No listings found</p>
      </div>

      <!-- Selected Listing Panel -->
      <div id="selectedPanel" class="selected-panel" style="display: none;">
        <div class="selected-header">
          <button id="backBtn" class="btn-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back
          </button>
        </div>

        <div class="selected-content">
          <!-- Listing Info Card -->
          <div class="listing-info-card">
            <h3 id="selectedTitle">Listing Title</h3>
            <p id="selectedPrice" class="selected-price">$0</p>
            <p id="selectedDescription" class="selected-description"></p>
          </div>

          <!-- Images Section -->
          <div class="images-section">
            <div class="section-header">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span>Images</span>
            </div>
            <div id="downloadStatus" class="download-status" style="display: none;"></div>
            <div id="imagesContainer" class="images-grid">
              <!-- Draggable images will be here -->
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="action-section">
            <button id="fillFormBtn" class="btn-primary" style="width: 100%; display: none;">
              Fill Facebook Form
            </button>
          </div>

          <!-- Status Messages -->
          <div class="status-section">
            <div class="status-message" id="statusMessage" style="display: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span>Form filled! Drag images and click Next on Facebook.</span>
            </div>
            <div id="categoryStatus" class="category-status" style="display: none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
