name: ListIt
options:
  minimumXcodeGenVersion: 2.37.0
  deploymentTarget:
    iOS: 16.0
configs:
  Debug: debug
  Staging: debug
  Release: release
workspace:
  name: ListIt
  projects:
    # Keep this entry as a plain string so XcodeGen emits ListIt.xcworkspace.
    # Using the dictionary form ("path: ...") makes XcodeGen treat the project
    # as an external reference and it will skip recreating the workspace.
    - ListIt.xcodeproj
packages:
  SharedCoreBridge:
    path: SharedCoreBridge
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.listit.app
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    OTHER_SWIFT_FLAGS: -warnings-as-errors
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  ListItApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
    resources:
      - path: Resources
    prebuildScripts:
      - name: Ensure Shared core bundle
        basedOnDependencyAnalysis: false
        script: |
          ROOT_DIR="$SRCROOT/.."
          CORE_BUNDLE_PATH="$SRCROOT/SharedCoreBridge/Resources/listit-core.js"
          if [ ! -f "$CORE_BUNDLE_PATH" ]; then
            echo "info: listit-core.js missing; running npm run build:core"
            if command -v npm >/dev/null 2>&1 && [ -f "$ROOT_DIR/package.json" ]; then
              (cd "$ROOT_DIR" && npm run --silent build:core) || exit 1
            else
              (cd "$ROOT_DIR" && node scripts/build-core.js) || exit 1
            fi
          fi
    dependencies:
      - target: AuthFeature
      - target: ListingsFeature
      - target: UploadFeature
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_NAME: ListIt
    scheme:
      testTargets:
        - ListItAppTests
      gatherCoverageData: true
  ListItAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: ListItApp
      - target: PlatformCapabilities
  AuthFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AuthFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
  ListingsFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ListingsFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
  UploadFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UploadFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
  SharedServices:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SharedServices
    resources:
      - path: Sources/SharedServices/Resources
    dependencies:
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
  SharedServicesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SharedServicesTests
    dependencies:
      - target: SharedServices
  DesignSystem:
    type: framework
    platform: iOS
    sources:
      - path: Sources/DesignSystem
  PlatformCapabilities:
    type: framework
    platform: iOS
    sources:
      - path: Sources/PlatformCapabilities
