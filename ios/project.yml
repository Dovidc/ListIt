name: ListIt
configs:
  Debug: debug
  Release: release
  Staging: debug

options:
  minimumXcodeGenVersion: 2.37.0
  deploymentTarget:
    iOS: 17.0

workspace:
  name: ListIt
  projects:
    - ListIt.xcodeproj

packages:
  SharedCoreBridge:
    path: SharedCoreBridge

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.listit.app
    DEVELOPMENT_TEAM: H9JP539MT9
    CODE_SIGN_STYLE: Automatic
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    OTHER_SWIFT_FLAGS: -warnings-as-errors
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING

targets:
  ListItApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
    resources:
      - path: Resources
    dependencies:
      - target: AuthFeature
      - target: ListingsFeature
      - target: UploadFeature
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_NAME: ListIt
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H9JP539MT9
        PROVISIONING_PROFILE_SPECIFIER: ""

    scheme:
      testTargets:
        - ListItAppTests
      gatherCoverageData: true

  ListItAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: ListItApp
      - target: PlatformCapabilities
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H9JP539MT9
        PROVISIONING_PROFILE_SPECIFIER: ""

  # ---- Feature / Framework targets ----
  # Disable signing for frameworks (simulator/dev) and synthesize an Info.plist.

  AuthFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AuthFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK

  ListingsFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ListingsFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK

  UploadFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UploadFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK

  SharedServices:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SharedServices
    resources:
      - path: Sources/SharedServices/Resources
    dependencies:
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK

  DesignSystem:
    type: framework
    platform: iOS
    sources:
      - path: Sources/DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK

  PlatformCapabilities:
    type: framework
    platform: iOS
    sources:
      - path: Sources/PlatformCapabilities
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK

  SharedServicesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SharedServicesTests
    dependencies:
      - target: SharedServices
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H9JP539MT9
        PROVISIONING_PROFILE_SPECIFIER: ""
