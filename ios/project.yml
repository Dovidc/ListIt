name: ListIt
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Staging: debug
  Release: release

workspace:
  name: ListIt
  projects:
    - ListIt.xcodeproj

packages:
  SharedCoreBridge:
    path: SharedCoreBridge

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.listit.app
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    OTHER_SWIFT_FLAGS: -warnings-as-errors
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  ListItApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
    resources:
      - path: Resources
    dependencies:
      - target: AuthFeature
      - target: ListingsFeature
      - target: UploadFeature
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_NAME: ListIt
    scheme:
      testTargets:
        - ListItAppTests
      gatherCoverageData: true

  ListItAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: ListItApp
      - target: PlatformCapabilities

  AuthFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AuthFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem

  ListingsFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ListingsFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem

  UploadFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/UploadFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem

  SharedServices:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SharedServices
    resources:
      - path: Sources/SharedServices/Resources
    dependencies:
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities

  SharedServicesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SharedServicesTests
    dependencies:
      - target: SharedServices

  DesignSystem:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/DesignSystem

  PlatformCapabilities:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PlatformCapabilities
