name: ListIt
options:
  minimumXcodeGenVersion: 2.37.0
  deploymentTarget:
    iOS: 16.0
configs:
  Debug: debug
  Staging: debug
  Release: release
workspace:
  name: ListIt
  projects:
    # Keep this entry as a plain string so XcodeGen emits ListIt.xcworkspace.
    # Using the dictionary form ("path: ...") makes XcodeGen treat the project
    # as an external reference and it will skip recreating the workspace.
    - ListIt.xcodeproj
packages:
  SharedCoreBridge:
    path: SharedCoreBridge
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.listit.app
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    OTHER_SWIFT_FLAGS: -warnings-as-errors
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING
targets:
  ListItApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
    resources:
      - path: Resources
    dependencies:
      - target: AuthFeature
      - target: ListingsFeature
      - target: UploadFeature
      - target: SharedServices
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
    preBuildScripts:
      - name: Ensure shared core bundle
        shell: /bin/bash
        script: |
          set -euo pipefail

          BUNDLE_PATH="$PROJECT_DIR/SharedCoreBridge/Resources/listit-core.js"
          if [ -f "$BUNDLE_PATH" ]; then
            echo "Shared core bundle already present at $BUNDLE_PATH"
            exit 0
          fi

          echo "Shared core bundle missing; generating via npm run build:core"

          if ! command -v npm >/dev/null 2>&1; then
            echo "error: npm is required to build the shared core bundle." >&2
            exit 1
          fi

          ROOT_DIR="$(cd "$PROJECT_DIR"/.. && pwd)"
          (cd "$ROOT_DIR" && npm run build:core)
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_NAME: ListIt
    scheme:
      testTargets:
        - ListItAppTests
      gatherCoverageData: true
  ListItAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: ListItApp
      - target: PlatformCapabilities
  AuthFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AuthFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
  ListingsFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ListingsFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
  UploadFeature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UploadFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
  SharedServices:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SharedServices
    resources:
      - path: Sources/SharedServices/Resources
    dependencies:
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
  SharedServicesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SharedServicesTests
    dependencies:
      - target: SharedServices
  DesignSystem:
    type: framework
    platform: iOS
    sources:
      - path: Sources/DesignSystem
  PlatformCapabilities:
    type: framework
    platform: iOS
    sources:
      - path: Sources/PlatformCapabilities
