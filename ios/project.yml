name: ListIt

options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Staging: debug
  Release: release

workspace:
  name: ListIt
  projects:
    - ListIt.xcodeproj

packages:
  SharedCoreBridge:
    path: SharedCoreBridge

# Global settings that apply to all targets unless overridden
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    OTHER_SWIFT_FLAGS: -warnings-as-errors
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES   # auto-generate Info.plist for frameworks
    PRODUCT_BUNDLE_IDENTIFIER: $(LISTIT_BUNDLE_PREFIX).$(PRODUCT_NAME:rfc1034identifier)
    DEVELOPMENT_TEAM: $(LISTIT_DEVELOPMENT_TEAM)

  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

  configFiles:
    Debug: Config/Signing.xcconfig
    Staging: Config/Signing.xcconfig
    Release: Config/Signing.xcconfig

targets:
  # -------------------- App --------------------
  ListItApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
    resources:
      - path: Resources
    dependencies:
      - target: AuthFeature
      - target: ListingsFeature
      - target: UploadFeature
      - target: NearbyFeature
      - target: MessagesFeature
      - target: AdminFeature
      - target: ProfileFeature
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_NAME: ListIt
        PRODUCT_BUNDLE_IDENTIFIER: $(LISTIT_APP_BUNDLE_IDENTIFIER)
        INFOPLIST_KEY_CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(LISTIT_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO   # app uses a real plist, not generated
    scheme:
      testTargets:
        - ListItAppTests
      gatherCoverageData: true

  ListItAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: ListItApp
      - target: PlatformCapabilities

  # -------------------- Features / Frameworks --------------------
  AuthFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AuthFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  ListingsFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ListingsFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  UploadFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/UploadFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  NearbyFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/NearbyFeature
    dependencies:
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  MessagesFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MessagesFeature
    dependencies:
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  AdminFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AdminFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
      - target: AuthFeature
      - target: UploadFeature
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  ProfileFeature:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ProfileFeature
    dependencies:
      - target: SharedServices
      - target: DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  SharedServices:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SharedServices
    resources:
      - path: Sources/SharedServices/Resources
    dependencies:
      - package: SharedCoreBridge
      - target: DesignSystem
      - target: PlatformCapabilities
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  SharedServicesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SharedServicesTests
    dependencies:
      - target: SharedServices

  DesignSystem:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/DesignSystem
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  PlatformCapabilities:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PlatformCapabilities
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
