<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Optional override that native shells can fill with an absolute API origin -->
  <meta name="listit-api-base" content="https://trovelr.com" />
  <title>Trovelr</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Prevent caching of app assets (helps mobile pick up changes) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    /* (your existing inline base styles stay exactly as-is) */
    :root {
      --radius: 16px;
      --accent: #111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #111;
      background: #fff;
      padding-top: calc(60px + env(safe-area-inset-top));
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(50px + env(safe-area-inset-top));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      z-index: 100;
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      padding-left: 16px;
      padding-right: 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }

    .btn {
      border-radius: var(--radius);
      border: 1px solid #ddd;
      padding: 10px 14px;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn.danger {
      color: #be123c;
      border-color: #fecdd3;
      background: #fff0f3;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .04);
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    input,
    textarea,
    select {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 10px 12px;
      width: 100%;
      font: inherit;
    }

    textarea {
      min-height: 80px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .aspect {
      position: relative;
      padding-top: 56%;
      background: #f3f4f6;
    }

    .aspect>img,
    .aspect>div {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .muted {
      color: #6b7280;
      font-size: 12px;
    }

    .split {
      display: flex;
      gap: 16px;
    }

    .col {
      flex: 1;
    }

    .sidebar {
      width: 320px;
      max-width: 40%;
    }

    .message {
      padding: 8px 12px;
      border-radius: 16px;
      margin: 6px 0;
      max-width: 80%;
    }

    .message.mine {
      background: #111;
      color: #fff;
      margin-left: auto;
    }

    .message.their {
      background: #f3f4f6;
      color: #111;
    }

    /* Modal styles */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open {
      display: flex;
    }

    /* Center image and contain to viewport */
    .modal-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      max-width: 95vw;
      max-height: 95vh;
    }

    /* Global loading overlay - updated */
    .global-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      z-index: 1000;
      pointer-events: all;
      opacity: 1;
      transition: opacity 0.3s ease-out;
      border: 12px solid transparent;
      border-image: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(147, 197, 253, 0.3), rgba(191, 219, 254, 0.2), transparent 70%) 1;
    }

    .global-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Calming blue border fade effect */
    .global-loader::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 100px 50px rgba(96, 165, 250, 0.25),
        inset 0 0 200px 100px rgba(147, 197, 253, 0.15);
      z-index: -1;
    }

    .global-loader .spinner {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 4px solid #e5e7eb;
      border-top-color: #3b82f6;
      animation: spin 0.9s linear infinite;
    }

    .global-loader .loader-text {
      font-weight: 700;
      color: #111;
      letter-spacing: .2px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .modal-inner img {
      display: block;
      max-width: 95vw;
      max-height: 95vh;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: auto;
      flex: 0 1 auto;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, .2);
      border: 0;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 18px;
      color: #fff;
    }

    .arrow.left {
      left: 8px;
    }

    .arrow.right {
      right: 8px;
    }

    .close {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, .2);
      border: 0;
      padding: 8px 10px;
      cursor: pointer;
      color: #fff;
      border-radius: 10px;
    }

    .thumbs {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #111;
      overflow: auto;
    }

    .thumbs img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 10px;
      opacity: .6;
      cursor: pointer;
    }

    .thumbs img.active {
      outline: 2px solid #fff;
      opacity: 1;
    }

    .distance {
      color: #16a34a;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
    }

    /* Mobile-first tweaks */
    html,
    body {
      font-size: 16px;
    }

    * {
      -webkit-text-size-adjust: 100%;
    }

    input,
    textarea,
    select {
      font-size: 16px;
      line-height: 1.35;
      min-height: 44px;
      padding: 12px 14px;
    }

    .btn {
      min-height: 44px;
      padding: 12px 16px;
    }

    .message {
      font-size: 15px;
    }

    header input {
      min-width: 140px;
    }

    .aspect {
      padding-top: 62%;
    }

    @media (max-width: 720px) {
      .container {
        padding: 12px;
      }

      header .container {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr;
      }

      header nav,
      header .row {
        flex-wrap: wrap;
      }

      .row {
        flex-wrap: wrap;
      }

      input,
      select,
      textarea,
      .btn {
        width: 100%;
        max-width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .split {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        max-width: 100%;
      }

      .message {
        max-width: 92%;
      }

      header .muted {
        display: none;
      }
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid #111;
      outline-offset: 2px;
      border-color: #111;
    }

    ::placeholder {
      color: #9ca3af;
    }

    a,
    button,
    .btn,
    input,
    textarea {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    .modal-inner {
      width: 100%;
      max-width: 100vw;
    }

    .thumbs {
      -webkit-overflow-scrolling: touch;
    }

    .supporter-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #facc15, #f59e0b 45%, #d97706);
      color: #fff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 10px 24px rgba(245, 158, 11, 0.45);
      overflow: hidden;
      cursor: default;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .supporter-badge::before {
      content: '';
      position: absolute;
      inset: -60%;
      background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.9), transparent 40%);
      opacity: 0.7;
      animation: supporter-glimmer-1 4.2s linear infinite;
    }

    .supporter-badge::after {
      content: '';
      position: absolute;
      inset: -70%;
      background: radial-gradient(circle at 80% 60%, rgba(255, 255, 255, 0.85), transparent 45%);
      opacity: 0.65;
      animation: supporter-glimmer-2 5.3s linear infinite reverse;
      pointer-events: none;
    }

    .supporter-badge__glimmer-3 {
      content: '';
      position: absolute;
      inset: -50%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.75), transparent 50%);
      opacity: 0.6;
      animation: supporter-glimmer-3 6.2s linear infinite;
      pointer-events: none;
    }

    .supporter-badge__glimmer-6 {
      content: '';
      position: absolute;
      inset: -65%;
      background: radial-gradient(circle at 40% 90%, rgba(255, 255, 255, 0.7), transparent 45%);
      opacity: 0.5;
      animation: supporter-glimmer-6 4.8s linear infinite;
      pointer-events: none;
    }

    .supporter-badge__glimmer-7 {
      content: '';
      position: absolute;
      inset: -55%;
      background: radial-gradient(circle at 90% 30%, rgba(255, 255, 255, 0.65), transparent 50%);
      opacity: 0.55;
      animation: supporter-glimmer-7 7.1s linear infinite reverse;
      pointer-events: none;
    }

    .supporter-badge__glimmer-8 {
      content: '';
      position: absolute;
      inset: -60%;

      animation: supporter-glimmer-8 5.9s linear infinite;
      pointer-events: none;
    }

    .supporter-badge--premium {
      background: linear-gradient(135deg, #e8e8e8, #c0c0c0 30%, #a8a8a8 60%, #909090);
      box-shadow: 0 10px 24px rgba(160, 160, 160, 0.5);
    }

    .supporter-badge--premium::before {
      background: radial-gradient(circle at 15% 25%, rgba(255, 255, 255, 0.95), transparent 35%);
      opacity: 0.8;
      animation: supporter-glimmer-1 3.2s linear infinite;
    }

    .supporter-badge--premium::after {
      background: radial-gradient(circle at 85% 70%, rgba(255, 255, 255, 0.9), transparent 40%);
      opacity: 0.75;
      animation: supporter-glimmer-2 4.1s linear infinite reverse;
    }

    .supporter-badge--premium .supporter-badge__glimmer-3 {
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.85), transparent 45%);
      opacity: 0.7;
      animation: supporter-glimmer-3 5.0s linear infinite;
    }

    .supporter-badge--premium .supporter-badge__glimmer-4 {
      background: radial-gradient(circle at 30% 80%, rgba(180, 160, 220, 0.4), transparent 40%);
      opacity: 0.35;
      animation: supporter-glimmer-4 4.4s linear infinite reverse;
    }

    .supporter-badge--premium .supporter-badge__glimmer-5 {
      background: radial-gradient(circle at 70% 20%, rgba(200, 180, 220, 0.35), transparent 45%);
      opacity: 0.3;
      animation: supporter-glimmer-5 5.4s linear infinite;
    }

    .supporter-badge--premium .supporter-badge__glimmer-6 {
      background: radial-gradient(circle at 40% 90%, rgba(255, 255, 255, 0.8), transparent 38%);
      opacity: 0.65;
      animation: supporter-glimmer-6 3.6s linear infinite;
    }

    .supporter-badge--premium .supporter-badge__glimmer-7 {
      background: radial-gradient(circle at 90% 30%, rgba(190, 170, 210, 0.4), transparent 42%);
      opacity: 0.35;
      animation: supporter-glimmer-7 4.7s linear infinite reverse;
    }

    .supporter-badge--premium .supporter-badge__glimmer-8 {
      background: radial-gradient(circle at 10% 70%, rgba(210, 190, 230, 0.35), transparent 40%);
      opacity: 0.3;
      animation: supporter-glimmer-8 3.9s linear infinite;
    }

    .supporter-badge--interactive {
      cursor: pointer;
    }

    .supporter-badge--interactive:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 14px 30px rgba(234, 179, 8, 0.55);
    }

    .supporter-badge--premium.supporter-badge--interactive:hover {
      box-shadow: 0 14px 30px rgba(192, 192, 192, 0.65);
    }

    .supporter-badge__icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .supporter-badge__label {
      position: relative;
      z-index: 1;
      font-size: 0.78rem;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .supporter-badge--premium .supporter-badge__label {
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .supporter-badge--sm {
      padding: 4px 10px;
      font-size: 0.65rem;
    }

    .supporter-badge--sm .supporter-badge__icon {
      width: 16px;
      height: 16px;
    }

    .supporter-badge--lg {
      padding: 12px 20px;
      font-size: 0.95rem;
    }

    .supporter-badge--lg .supporter-badge__icon {
      width: 30px;
      height: 30px;
    }

    @keyframes supporter-glimmer-1 {
      0% {
        transform: rotate(0deg) translateX(-10%);
      }

      50% {
        transform: rotate(180deg) translateX(10%);
      }

      100% {
        transform: rotate(360deg) translateX(-10%);
      }
    }

    @keyframes supporter-glimmer-2 {
      0% {
        transform: rotate(0deg) translateY(-8%);
      }

      50% {
        transform: rotate(180deg) translateY(8%);
      }

      100% {
        transform: rotate(360deg) translateY(-8%);
      }
    }

    @keyframes supporter-glimmer-3 {
      0% {
        transform: rotate(0deg) translate(5%, 5%);
      }

      50% {
        transform: rotate(180deg) translate(-5%, -5%);
      }

      100% {
        transform: rotate(360deg) translate(5%, 5%);
      }
    }

    @keyframes supporter-glimmer-4 {
      0% {
        transform: rotate(0deg) translate(-8%, 12%);
      }

      50% {
        transform: rotate(180deg) translate(8%, -12%);
      }

      100% {
        transform: rotate(360deg) translate(-8%, 12%);
      }
    }

    @keyframes supporter-glimmer-5 {
      0% {
        transform: rotate(0deg) translate(12%, -6%);
      }

      50% {
        transform: rotate(180deg) translate(-12%, 6%);
      }

      100% {
        transform: rotate(360deg) translate(12%, -6%);
      }
    }

    @keyframes supporter-glimmer-6 {
      0% {
        transform: rotate(0deg) translate(-6%, 14%);
      }

      50% {
        transform: rotate(180deg) translate(6%, -14%);
      }

      100% {
        transform: rotate(360deg) translate(-6%, 14%);
      }
    }

    @keyframes supporter-glimmer-7 {
      0% {
        transform: rotate(0deg) translate(15%, -4%);
      }

      50% {
        transform: rotate(180deg) translate(-15%, 4%);
      }

      100% {
        transform: rotate(360deg) translate(15%, -4%);
      }
    }

    @keyframes supporter-glimmer-8 {
      0% {
        transform: rotate(0deg) translate(-10%, -10%);
      }

      50% {
        transform: rotate(180deg) translate(10%, 10%);
      }

      100% {
        transform: rotate(360deg) translate(-10%, -10%);
      }
    }

    @keyframes shine {

      0%,
      100% {
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.4);
      }

      50% {
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), inset 0 0 16px rgba(255, 255, 255, 0.6);

    @keyframes shine-platinum {

      0%,
      100% {
        box-shadow: 0 0 8px rgba(200, 200, 200, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      }

      50% {

      }

      100% {

        filter: brightness(1);
      }

      50% {

        filter: brightness(1.3);
      }

  <!-- 🔗 Global overrides (desktop + mobile).
         Put AFTER the base <style> so it can override where needed. -->

  <script>
    (function () {
      const viewport = document.querySelector('meta[name="viewport"]');
      if (!viewport) return;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

      if (!isIOS && !isCoarsePointer) return;

      const baseContent = 'width=device-width, initial-scale=1, viewport-fit=cover';
      const lockedContent = `${baseContent}, maximum-scale=1`;

      const applyLockedViewport = () => viewport.setAttribute('content', lockedContent);
      const restoreViewport = () => viewport.setAttribute('content', baseContent);

      const shouldLock = (element) =>
        element instanceof HTMLElement && element.matches('input, textarea, select');

      window.addEventListener(
        'focusin',
        (event) => {
          if (!shouldLock(event.target)) return;
          applyLockedViewport();
        },
        { passive: true }
      );

      window.addEventListener(
        'focusout',
        (event) => {
          if (!shouldLock(event.target)) return;
          restoreViewport();
        },
        { passive: true }
      );

      document.addEventListener('gesturestart', restoreViewport, { passive: true });
    })();
  </script>

  <script>
    (function() {
      // Capture notification taps that launched the app (cold-start)
      // This runs immediately to catch the event before React mounts
      window.ListItApp = window.ListItApp || {};

      function setupEarlyPushListener() {
        var Capacitor = window.Capacitor;
        if (!Capacitor) return;

        var platform = Capacitor.getPlatform && Capacitor.getPlatform();
        if (platform !== 'ios' && platform !== 'android') return;

        var plugins = Capacitor.Plugins || {};
        var PushNotifications = plugins.PushNotifications;
        if (!PushNotifications || !PushNotifications.addListener) return;

        PushNotifications.addListener('pushNotificationActionPerformed', function(action) {
          var data = action && action.notification && action.notification.data;
          var conversationId = data && data.conversation_id;
          if (conversationId) {
            // Store for app-shell to pick up once React mounts
            window.ListItApp._pendingConversationId = conversationId;
            console.log('[Push] Cold-start notification tap, conversation:', conversationId);
          }
        });
        console.log('[Push] Early listener registered');
      }

      setupEarlyPushListener();
    })();
  </script>
