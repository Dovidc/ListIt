<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Theme color for iOS status bar - updated dynamically by JS -->
  <meta name="theme-color" content="#0f172a" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Apply dark mode FIRST before any styles to prevent flash -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        var themeColorMeta = document.getElementById('theme-color-meta');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.background = '#0f172a';
          document.documentElement.style.colorScheme = 'dark';
          if (themeColorMeta) themeColorMeta.content = '#0f172a';
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* (your existing inline base styles stay exactly as-is) */
    :root {
      --radius: 16px;
      --accent: #111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #111;
      background: #f8fafc;
      padding-top: 60px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(248, 250, 252, 0.95);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      z-index: 100;
      display: flex;
      align-items: center;
      padding-left: 16px;
      padding-right: 16px;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px;
    }

    .btn {
      border-radius: var(--radius);
      border: 1px solid #ddd;
      padding: 10px 14px;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn.danger {
      color: #be123c;
      border-color: #fecdd3;
      background: #fff0f3;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .04);
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    input,
    textarea,
    select {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 10px 12px;
      width: 100%;
      font: inherit;
      background: #fff;
      color: #111;
    }

    textarea {
      min-height: 80px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .aspect {
      position: relative;
      padding-top: 56%;
      background: #f3f4f6;
    }

    .aspect>img,
    .aspect>div {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .muted {
      color: #6b7280;
      font-size: 12px;
    }

    .split {
      display: flex;
      gap: 16px;
    }

    .col {
      flex: 1;
    }

    .sidebar {
      width: 320px;
      max-width: 40%;
    }

    .message {
      padding: 8px 12px;
      border-radius: 16px;
      margin: 6px 0;
      max-width: 80%;
    }

    .message.mine {
      background: #111;
      color: #fff;
      margin-left: auto;
    }

    .message.their {
      background: #f3f4f6;
      color: #111;
    }

    /* Modal styles */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open {
      display: flex;
    }

    /* Center image and contain to viewport */
    .modal-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      max-width: 95vw;
      max-height: 95vh;
    }

    /* Global loading overlay - updated */
    .global-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      z-index: 1000;
      pointer-events: all;
      opacity: 1;
      transition: opacity 0.3s ease-out;
      border: 12px solid transparent;
      border-image: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(147, 197, 253, 0.3), rgba(191, 219, 254, 0.2), transparent 70%) 1;
    }

    .global-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Calming blue border fade effect */
    .global-loader::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 100px 50px rgba(96, 165, 250, 0.25),
        inset 0 0 200px 100px rgba(147, 197, 253, 0.15);
      z-index: -1;
    }

    .global-loader .spinner {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 4px solid #e5e7eb;
      border-top-color: #3b82f6;
      animation: spin 0.9s linear infinite;
    }

    .global-loader .loader-text {
      font-weight: 700;
      color: #111;
      letter-spacing: .2px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Mini geometric loader for infinite scroll */
    .mini-geometric-loader {
      position: relative;
      width: 36px;
      height: 36px;
    }

    .mini-geometric-loader__hex {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 2px solid;
      border-radius: 3px;
    }

    .mini-geometric-loader__hex--outer {
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      border-color: #2563eb;
      animation: hex-rotate 3s linear infinite, mini-hex-pulse 1.5s ease-in-out infinite;
    }

    .mini-geometric-loader__hex--middle {
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border-color: #3b82f6;
      animation: hex-rotate-reverse 2.5s linear infinite, mini-hex-pulse 1.5s ease-in-out infinite 0.2s;
    }

    .mini-geometric-loader__hex--inner {
      width: 12px;
      height: 12px;
      margin-left: -6px;
      margin-top: -6px;
      border-color: #60a5fa;
      animation: hex-rotate 2s linear infinite, mini-hex-pulse 1.5s ease-in-out infinite 0.4s;
    }

    @keyframes hex-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes hex-rotate-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes mini-hex-pulse {
      0%, 100% { opacity: 0.6; border-radius: 3px; }
      50% { opacity: 1; border-radius: 50%; }
    }

    .modal-inner img {
      display: block;
      max-width: 95vw;
      max-height: 95vh;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: auto;
      flex: 0 1 auto;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, .2);
      border: 0;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 18px;
      color: #fff;
    }

    .arrow.left {
      left: 8px;
    }

    .arrow.right {
      right: 8px;
    }

    .close {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, .2);
      border: 0;
      padding: 8px 10px;
      cursor: pointer;
      color: #fff;
      border-radius: 10px;
    }

    .thumbs {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #111;
      overflow: auto;
    }

    .thumbs img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 10px;
      opacity: .6;
      cursor: pointer;
    }

    .thumbs img.active {
      outline: 2px solid #fff;
      opacity: 1;
    }

    .distance {
      color: #16a34a;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
    }

    /* Mobile-first tweaks */
    html,
    body {
      font-size: 16px;
    }

    * {
      -webkit-text-size-adjust: 100%;
    }

    input,
    textarea,
    select {
      font-size: 16px;
      line-height: 1.35;
      min-height: 44px;
      padding: 12px 14px;
    }

    .btn {
      min-height: 44px;
      padding: 12px 16px;
    }

    .message {
      font-size: 15px;
    }

    header input {
      min-width: 140px;
    }

    .aspect {
      padding-top: 62%;
    }

    @media (max-width: 720px) {
      .container {
        padding: 12px;
      }

      header .container {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr;
      }

      header nav,
      header .row {
        flex-wrap: wrap;
      }

      .row {
        flex-wrap: wrap;
      }

      input,
      select,
      textarea,
      .btn {
        width: 100%;
        max-width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .split {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        max-width: 100%;
      }

      .message {
        max-width: 92%;
      }

      header .muted {
        display: none;
      }
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid #111;
      outline-offset: 2px;
      border-color: #111;
    }

    ::placeholder {
      color: #9ca3af;
    }

    a,
    button,
    .btn,
    input,
    textarea {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    .modal-inner {
      width: 100%;

    }

    .thumbs {
      -webkit-overflow-scrolling: touch;
    }

    @keyframes supporter-glimmer-1 {
      0% {
        transform: rotate(0deg) translateX(-10%);
      }

      50% {
        transform: rotate(180deg) translateX(10%);
      }

      100% {
        transform: rotate(360deg) translateX(-10%);
      }
    }

    @keyframes supporter-glimmer-2 {
      0% {
        transform: rotate(0deg) translateY(-8%);
      }

      50% {
        transform: rotate(180deg) translateY(8%);
      }

      100% {
        transform: rotate(360deg) translateY(-8%);
      }
    }

    @keyframes supporter-glimmer-3 {
      0% {
        transform: rotate(0deg) translate(5%, 5%);
      }

      50% {

      }

      100% {
        transform: rotate(360deg) translate(5%, 5%);
      }
    }

    @keyframes shine {

      }

      50% {
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), inset 0 0 16px rgba(255, 255, 255, 0.6);
      }

      0%,
      100% {
        box-shadow: 0 0 8px rgba(200, 200, 200, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      }

      50% {
        box-shadow: 0 0 12px rgba(220, 220, 220, 1), inset 0 1px 3px rgba(255, 255, 255, 1);
      }

    @keyframes badge-shine {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.95; filter: brightness(1.3); }
    }

    /* Supporter Badge Animations - Subtle */
    @keyframes badge-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes badge-glow-subtle {
      0%, 100% { filter: drop-shadow(0 0 2px var(--badge-glow)); }
      50% { filter: drop-shadow(0 0 4px var(--badge-glow)) drop-shadow(0 0 6px var(--badge-glow)); }
    }

    @keyframes badge-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes badge-sparkle {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes badge-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }

    @keyframes badge-shimmer {
      0% { transform: translateX(-100%) rotate(25deg); }
      100% { transform: translateX(100%) rotate(25deg); }
    }

    @keyframes opal-shift {
      0%, 100% { filter: hue-rotate(0deg) drop-shadow(0 0 3px rgba(135, 206, 235, 0.5)); }
      33% { filter: hue-rotate(40deg) drop-shadow(0 0 4px rgba(255, 182, 193, 0.5)); }
      66% { filter: hue-rotate(-30deg) drop-shadow(0 0 4px rgba(152, 251, 152, 0.5)); }
    }

  <!-- 🔗 Global overrides (desktop + mobile).
         Put AFTER the base <style> so it can override where needed. -->
  <link rel="stylesheet" href="/app.css?v=profile-picture-feature-1" />

  <script>
    (function () {
      const viewport = document.querySelector('meta[name="viewport"]');
      if (!viewport) return;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

      if (!isIOS && !isCoarsePointer) return;

      const baseContent = 'width=device-width, initial-scale=1, viewport-fit=cover';
      const lockedContent = `${baseContent}, maximum-scale=1`;

      const applyLockedViewport = () => viewport.setAttribute('content', lockedContent);
      const restoreViewport = () => viewport.setAttribute('content', baseContent);

      const shouldLock = (element) =>
        element instanceof HTMLElement && element.matches('input, textarea, select');

      window.addEventListener(
        'focusin',
        (event) => {
          if (!shouldLock(event.target)) return;
          applyLockedViewport();
          // Add keyboard-open class to hide bottom nav on Android/iOS
          document.body.classList.add('keyboard-open');
        },
        { passive: true }
      );

      window.addEventListener(
        'focusout',
        (event) => {
          if (!shouldLock(event.target)) return;
          restoreViewport();
          // Remove keyboard-open class to show bottom nav again
          document.body.classList.remove('keyboard-open');
        },
        { passive: true }
      );

      document.addEventListener('gesturestart', restoreViewport, { passive: true });
    })();
  </script>

  <!-- Android detection and keyboard handling -->
  <script>
    (function() {
      // Only run on Android
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (!isAndroid) return;

      // Add Android class when DOM is ready
      function addAndroidClass() {
        if (document.body) {
          document.body.classList.add('is-android');
        } else {
          document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('is-android');
          });
        }
      }
      addAndroidClass();

      const isInput = (el) => el && el.matches && el.matches('input, textarea, select');

      window.addEventListener('focusin', (e) => {
        if (isInput(e.target)) {
          document.body.classList.add('keyboard-open');
        }
      }, { passive: true, capture: true });

      window.addEventListener('focusout', (e) => {
        if (isInput(e.target)) {
          // Small delay to handle focus switching between inputs
          setTimeout(() => {
            if (!document.activeElement || !isInput(document.activeElement)) {
              document.body.classList.remove('keyboard-open');
            }
          }, 100);
        }
      }, { passive: true, capture: true });
    })();
  </script>
